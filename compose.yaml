services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      POSTGRES_DB: mabase
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mabase
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data: