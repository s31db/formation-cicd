name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image (Python ${{ matrix.python-version }})
        run: |
          docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t mon-app:ci-${{ matrix.python-version }} .
      - name: Vérifier que l'image répond
        run: |
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            postgres:16
          docker run -d -p 5000:5000 --name ci-test --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            mon-app:ci-${{ matrix.python-version }}
          for i in $(seq 1 10); do curl --fail http://localhost:5000 && break; sleep 2; done
          docker rm -f ci-test db
          docker network rm ci-net