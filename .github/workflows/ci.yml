name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
      - name: Vérifier que l'image répond
        run: |
          docker load -i mon-app.tar
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            postgres:16
          docker run -d -p 5000:5000 --name ci-test --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            mon-app:ci
          for i in $(seq 1 10); do curl --fail http://localhost:5000 && break; sleep 2; done
          docker rm -f ci-test db
          docker network rm ci-net
      - uses: actions/upload-artifact@v4
        with:
          name: mon-app-image
          path: mon-app.tar

  run-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image testée
        uses: actions/download-artifact@v4
        with:
          name: mon-app-image
      - name: Charger l'image
        run: docker load -i mon-app.tar
      - name: Démarrer la stack avec l'image déjà testée
        run: |
          cat <<'EOF' > compose.ci.yaml
          services:
            web:
              image: mon-app:ci
          EOF
          docker compose -f compose.yaml -f compose.ci.yaml up -d
      - name: Attendre que l'application réponde
        run: |
          for i in $(seq 1 10); do
            curl --fail http://localhost:5000 && break
            sleep 2
          done
      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt
      - name: Exécuter la suite de tests
        run: pytest tests/ -v --junitxml=rapport-tests.xml
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: rapport-tests.xml
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  push-image:
    needs: [build-and-test, run-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Récupérer l'image testée
        uses: actions/download-artifact@v4
        with:
          name: mon-app-image
      - name: Charger l'image
        run: docker load -i mon-app.tar
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retagger et publier
        run: |
          docker tag mon-app:ci ghcr.io/${{ github.repository }}:latest
          docker tag mon-app:ci ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}