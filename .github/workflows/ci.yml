name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
      - name: Vérifier que l'image répond
        run: |
          docker network create ci-net
          docker run -d --name db --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            postgres:16
          docker run -d -p 5000:5000 --name ci-test --network ci-net \
            -e POSTGRES_DB=mabase -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret \
            mon-app:ci
          for i in $(seq 1 10); do curl --fail http://localhost:5000 && break; sleep 2; done
          docker rm -f ci-test db
          docker network rm ci-net
      - uses: actions/upload-artifact@v4
        with:
          name: mon-app-image
          path: mon-app.tar

  run-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image testée
        uses: actions/download-artifact@v4
        with:
          name: mon-app-image
      - name: Charger l'image
        run: docker load -i mon-app.tar
      - name: Démarrer la stack avec l'image déjà testée
        run: |
          cat <<'EOF' > compose.ci.yaml
          services:
            web:
              image: mon-app:ci
          EOF
          docker compose -f compose.yaml -f compose.ci.yaml up -d
      - name: Attendre que l'application réponde
        run: |
          for i in $(seq 1 10); do
            curl --fail http://localhost:5000 && break
            sleep 2
          done
      - name: Installer les dépendances de test
        run: pip install -r requirements-test.txt
      - name: Exécuter la suite de tests
        run: pytest tests/ -v --junitxml=rapport-tests.xml
      - name: Résumé des tests dans GitHub
        if: always()
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("rapport-tests.xml").getroot()
          suite = root.find("testsuite")
          print(f"### Résultats pytest — {suite.get('tests')} tests, {suite.get('failures')} échec(s)")
          print()
          print("| Test | Résultat | Durée |")
          print("|---|---|---|")
          for tc in suite.findall("testcase"):
              failed = tc.find("failure") is not None or tc.find("error") is not None
              icon = "❌" if failed else "✅"
              print(f"| `{tc.get('name')}` | {icon} | {float(tc.get('time')):.3f}s |")
          PYEOF
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: rapport-tests.xml
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  scan-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'image testée
        uses: actions/download-artifact@v4
        with:
          name: mon-app-image
      - name: Charger l'image
        run: docker load -i mon-app.tar
      - name: Scanner avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mon-app:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  notify:
    needs: [build-and-test, run-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notifier Discord du résultat
        run: |
          STATUT="${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Pipeline $STATUT sur ${{ github.sha }}\"}"

  push-image:
    needs: [build-and-test, run-tests, scan-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Récupérer l'image testée
        uses: actions/download-artifact@v4
        with:
          name: mon-app-image
      - name: Charger l'image
        run: docker load -i mon-app.tar
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retagger et publier
        run: |
          docker tag mon-app:ci ghcr.io/${{ github.repository }}:latest
          docker tag mon-app:ci ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
